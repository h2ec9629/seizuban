<style>
/* Layout: drafting board — tool rail on top, sheet in the middle, spec panel on the right (below on phones) */
:root{
  --bg:#e7ebe8; --panel:#f6f8f6; --paper:#fbfcfa; --ink:#1d2b36; --muted:#5b6a70;
  --line:#cdd5d1; --grid:#e6ebe8; --grid-major:#cfd8d3; --axis:#b7c4be;
  --accent:#d95d16; --sel:#1f6fd1; --block:rgba(31,111,209,.06);
  --font:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181b; --panel:#1a2226; --paper:#0f1417; --ink:#dde6e9; --muted:#8d9ba1;
  --line:#2b363b; --grid:#172024; --grid-major:#223036; --axis:#34464d;
  --accent:#ff8a3d; --sel:#5aa9ff; --block:rgba(90,169,255,.08); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --panel:#1a2226; --paper:#0f1417; --ink:#dde6e9; --muted:#8d9ba1;
  --line:#2b363b; --grid:#172024; --grid-major:#223036; --axis:#34464d;
  --accent:#ff8a3d; --sel:#5aa9ff; --block:rgba(90,169,255,.08); color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
.app{height:100%;display:grid;gap:8px;padding:8px 16px;
  grid-template-columns:minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"bar bar" "stage side" "status status"}
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{font-weight:600;font-size:15px;letter-spacing:.04em;margin-right:6px;white-space:nowrap}
.brand small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.tools,.acts{display:flex;flex-wrap:wrap;gap:4px}
.acts{margin-left:auto}
button,.btn,select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;min-height:40px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.tool:disabled{opacity:.3;cursor:not-allowed}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool kbd{font-family:var(--mono);font-size:10px;opacity:.55}
.stage{grid-area:stage;position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:absolute;left:10px;top:10px;font-size:12px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:4px 8px;pointer-events:none;max-width:calc(100% - 20px)}
.side{grid-area:side;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;min-height:0}
.side h2{font-size:13px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.side h2 .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:1px 5px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields.three{grid-template-columns:1fr 1fr .8fr auto}
.side input{font-size:12px;padding:0 5px;min-height:34px}
.side .fields{gap:6px}
.side input[type=number]{-moz-appearance:textfield;appearance:textfield}
.side input::-webkit-inner-spin-button,.side input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.side .fields label{font-size:10px}
.ptdel{align-self:end;min-height:34px;width:30px;padding:0;justify-content:center;color:var(--accent);border-color:var(--line)}
.ptdel:hover{border-color:var(--accent)}
#ctx{position:absolute;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;display:grid;gap:2px;min-width:170px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#ctx button{justify-content:flex-start;min-height:36px;border-color:transparent;background:transparent}
#ctx button:hover{background:var(--bg)}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);letter-spacing:.04em;min-width:0}
.fields label.hl{color:var(--accent);font-weight:600}
.fields label.hl input{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.fields label.wide{grid-column:1/-1}
input{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;
  min-height:38px;padding:0 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.danger{color:var(--accent);border-color:var(--accent)}
.tips{margin:0;padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--muted)}
.tips b{color:var(--ink);font-weight:600}
.status{grid-area:status;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted)}
.coord{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);display:inline-block;width:26ch;flex:none;white-space:pre;overflow:hidden}
.tog{min-height:32px;font-size:12px}
.tog[aria-pressed="true"]{color:var(--sel);border-color:var(--sel)}
.mods{display:inline-flex;align-items:center;gap:4px}
.mod{font-family:var(--mono);padding:0 8px}
.status select{min-height:32px;font-size:12px;font-family:var(--mono)}
details.file{position:relative}
details.file summary{list-style:none}
details.file summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:6px;display:grid;gap:4px;min-width:190px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.menu button{justify-content:flex-start;width:100%}
.menu .fname{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);padding:2px 4px 6px}
.menu small{font-size:11px;color:var(--muted);padding:4px 6px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font-size:13px;padding:8px 14px;border-radius:6px;z-index:9;max-width:calc(100% - 32px)}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:11px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:5px;margin-top:8px}
[hidden]{display:none!important}
.bgbar{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;max-width:calc(100% - 20px)}
.bgbar label{display:inline-flex;align-items:center;gap:4px}
.bgbar input[type=range]{width:90px;min-height:0;padding:0}
.dlg-back{position:fixed;inset:0;background:rgba(10,15,18,.45);display:grid;place-items:center;z-index:20;padding:16px}
.dlg-body{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
.pv{display:flex;flex-direction:column;gap:6px}
#dlgPv{width:240px;height:240px;border:1px solid var(--line);border-radius:6px;background:var(--paper);display:block;max-width:100%}
.pv-info{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
@media (max-width:620px){.dlg-body{grid-template-columns:minmax(0,1fr)}.pv{align-items:center}}
.dlg{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:16px;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 12px;font-size:14px}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:10px;color:var(--muted)}
.chk input{width:auto;min-height:0}
.dlg .row{justify-content:flex-end}
.primary{background:var(--sel);color:var(--paper);border-color:var(--sel);min-width:80px;justify-content:center}

  <div class="row"><button type="button" data-v3="iso">斜め</button><button type="button" data-v3="front">正面</button><button type="button" data-v3="right">右</button><button type="button" data-v3="back">背面</button><button type="button" data-v3="left">左</button><button type="button" data-v3="top">真上</button>
  <button type="button" id="v3Png">PNGで保存</button><button type="button" id="v3Close" class="primary">閉じる</button></div></div></div>
<div class="dlg-back" id="pst" hidden><div class="dlg"><h3>Claudeが作った図面を貼り付け</h3>
  <textarea id="pstTa" style="width:100%;height:220px;font-family:var(--mono);font-size:12px;box-sizing:border-box" placeholder="チャットでClaudeが出した図面データをここに貼り付け（```json ～ ``` ごとでOK）"></textarea>
  <p class="tips" style="padding:0;margin:8px 0 0" id="pstInfo"></p>
  <div class="row"><button type="button" id="pstCancel">キャンセル</button><button type="button" id="pstAdd">今の図に足す</button><button type="button" id="pstRep" class="primary">置き換える</button></div></div></div>
<div class="dlg-back" id="six" hidden><div class="dlg" style="width:min(1100px,100%)"><h3>6面図（第三角法：上=平面／中段 左・正面・右・背面／下=底面）</h3>
  <canvas id="sixCv" style="height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:default"></canvas>
  <p class="tips" style="padding:0;margin:8px 0 0" id="sixInfo"></p>
  <div class="row"><button type="button" id="sixPng">PNGで保存</button><button type="button" id="sixPdf">PDFで保存</button><button type="button" id="sixClose" class="primary">閉じる</button></div></div></div>
<div class="dlg-back" id="ext" hidden><form class="dlg" id="extForm" style="width:min(560px,100%)"><h3>輪郭の取り出し</h3>
  <canvas id="extPv" style="display:block;width:100%;touch-action:none;border:1px solid var(--line);border-radius:6px;background:var(--paper)"></canvas>
  <div class="fields" style="margin-top:10px"><label>感度（右ほど広く拾う）<input type="range" id="extSens" min="40" max="220" value="100" style="padding:0;min-height:28px"></label>
  <label>細かさ（右ほど点が多い）<input type="range" id="extEps" min="1" max="20" value="12" style="padding:0;min-height:28px"></label>
  <label class="wide">影を無視（右ほど「暗いだけの所」を背景あつかい）<input type="range" id="extShadow" min="0" max="100" value="0" style="padding:0;min-height:28px"></label></div>
  <div class="row" style="margin-top:6px;align-items:center"><button type="button" id="extErase" class="tog" aria-pressed="false">消しゴム</button><button type="button" id="extAdd" class="tog" aria-pressed="false">ペン（足す）</button>
  <label style="font-size:11px;display:inline-flex;gap:4px;align-items:center;color:var(--muted)">太さ<input type="range" id="extBrush" min="3" max="40" value="12" style="width:90px;padding:0;min-height:24px"></label><button type="button" id="extClr" class="tog">手直しを全部消す</button></div>
  <p class="tips" style="padding:0;margin:8px 0 0" id="extInfo"></p>
  <div class="row"><button type="button" id="extCancel">キャンセル</button><button type="submit" class="primary">図形にする</button></div></form></div>
<div class="dlg-back" id="persp" hidden><form class="dlg" id="perspForm" style="width:min(360px,100%)"><h3>斜め撮りの補正</h3>
  <p class="tips" style="padding:0;margin:0 0 10px">タップした4点で囲んだ長方形の、実際の大きさを入れてください。補正すると縮尺も同時に合います。</p>
  <div class="fields"><label>横（画面で上の辺）mm<input id="pW" type="number" step="any" inputmode="decimal"></label><label>縦（画面で左の辺）mm<input id="pH" type="number" step="any" inputmode="decimal"></label></div>
  <div class="row"><button type="button" id="pCancel">キャンセル</button><button type="submit" class="primary">補正する</button></div></form></div>
<div class="dlg-back" id="cal" hidden><form class="dlg" id="calForm" style="width:min(340px,100%)"><h3>縮尺合わせ</h3>
  <p class="tips" style="padding:0;margin:0 0 10px" id="calInfo"></p>
  <div class="fields"><label class="wide">2点間の実際の長さ (mm)<input id="calLen" type="number" step="any" inputmode="decimal" min="0"></label></div>
  <div class="row"><button type="button" id="calCancel">キャンセル</button><button type="submit" class="primary">合わせる</button></div></form></div>

        if(s.type==='circle'){ctx.strokeStyle=C.muted;ctx.lineWidth=1;ctx.setLineDash([8,3,2,3]);ctx.beginPath();ctx.moveTo(rx+rw/2,ry-6);ctx.lineTo(rx+rw/2,ry+rhh+6);ctx.stroke();ctx.setLineDash([]);}

/* ---------- 3Dビュワー（見るだけ。外部部品なしの自前描画なのでオフラインでも動く） ----------

   てっぺんの縮み% があれば上の面を中心に向かって小さくする（角すい・円すい）。 */
const V3P={iso:[-35,28],front:[0,6],right:[-90,6],back:[180,6],left:[90,6],top:[0,89.9]};
const PAL=['#7fa7c9','#d1a777','#8fc29a','#cf8f9b','#a99bd1','#c9c27f','#7fc4c2','#b0a69a'];

function ring3(s){let P;
  if(s.type==='circle'){P=[];for(let i=0;i<48;i++){const t=i/48*T2;P.push([s.cx+s.r*Math.cos(t),s.cy+s.r*Math.sin(t)]);}}

      const Tp=B.map(p=>[cx+(p[0]-cx)*f,cy+(p[1]-cy)*f]),col=nm?PAL[n++%PAL.length]:'#cfd6dc',closed=s.type!=='poly'||s.closed;
      const sharp=B.map((p,i)=>{if(!closed&&(i===0||i===m-1))return true;const a=B[(i-1+m)%m],c=B[(i+1)%m],u=[p[0]-a[0],p[1]-a[1]],v=[c[0]-p[0],c[1]-p[1]];
        const cs=(u[0]*v[0]+u[1]*v[1])/((Math.hypot(...u)*Math.hypot(...v))||1);return cs<Math.cos(Math.PI/12);});

      if(closed){F.push({p:B.map(p=>[...p,z0]),c:col});if(f>0)F.push({p:Tp.map(p=>[...p,z1]),c:col});}

      else if(s.type==='arc')P=sampleEl(arcEl(s));

function draw3(){if(!v3)return;const{g,W,H,m}=v3,a=v3.yaw*Math.PI/180,e=v3.pit*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),ce=Math.cos(e),se=Math.sin(e);
